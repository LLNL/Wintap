<svg viewBox="0 0 1000 700" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1000" height="700" fill="#f8f9fa" />
  <text x="500" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#333">Wintap Architecture</text>
  
  <!-- Core Infrastructure -->
  <rect x="260" y="100" width="480" height="170" rx="10" fill="#e1f5fe" stroke="#0277bd" stroke-width="2" />
  <text x="500" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#0277bd">Core Infrastructure</text>
  
  <!-- WintapSvc and Service Controller -->
  <rect x="280" y="140" width="200" height="50" rx="5" fill="#b3e5fc" stroke="#0288d1" stroke-width="1" />
  <text x="380" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#01579b">WintapSvc / Service Controller</text>
  
  <!-- Event Channel -->
  <rect x="520" y="140" width="200" height="50" rx="5" fill="#b3e5fc" stroke="#0288d1" stroke-width="1" />
  <text x="620" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#01579b">Event Channel</text>
  
  <!-- State Manager -->
  <rect x="280" y="200" width="200" height="50" rx="5" fill="#b3e5fc" stroke="#0288d1" stroke-width="1" />
  <text x="380" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#01579b">State Manager</text>
  
  <!-- Watchdog -->
  <rect x="520" y="200" width="200" height="50" rx="5" fill="#b3e5fc" stroke="#0288d1" stroke-width="1" />
  <text x="620" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#01579b">Watchdog</text>
  
  <!-- Collectors -->
  <rect x="50" y="320" width="220" height="220" rx="10" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2" />
  <text x="160" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2e7d32">Collectors</text>
  <text x="160" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#2e7d32">(Data Sources)</text>
  
  <!-- Process Collector -->
  <rect x="70" y="390" width="180" height="30" rx="5" fill="#c8e6c9" stroke="#388e3c" stroke-width="1" />
  <text x="160" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#1b5e20">Process Collector</text>
  
  <!-- File Collector -->
  <rect x="70" y="430" width="180" height="30" rx="5" fill="#c8e6c9" stroke="#388e3c" stroke-width="1" />
  <text x="160" y="450" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#1b5e20">File Collector</text>
  
  <!-- TCP Collector -->
  <rect x="70" y="470" width="180" height="30" rx="5" fill="#c8e6c9" stroke="#388e3c" stroke-width="1" />
  <text x="160" y="490" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#1b5e20">TCP Collector</text>
  
  <!-- Registry Collector -->
  <rect x="70" y="510" width="180" height="30" rx="5" fill="#c8e6c9" stroke="#388e3c" stroke-width="1" />
  <text x="160" y="530" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#1b5e20">Registry/Other Collectors</text>
  
  <!-- Windows ETW System - MOVED to align under Collectors -->
  <rect x="85" y="580" width="150" height="40" rx="5" fill="#ffcdd2" stroke="#d32f2f" stroke-width="1" />
  <text x="160" y="605" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#b71c1c">Windows ETW System</text>
  
  <!-- ETL Pipeline -->
  <rect x="290" y="320" width="220" height="220" rx="10" fill="#fff3e0" stroke="#e65100" stroke-width="2" />
  <text x="400" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#e65100">ETL Pipeline</text>
  
  <!-- Extract -->
  <rect x="310" y="390" width="180" height="30" rx="5" fill="#ffe0b2" stroke="#ef6c00" stroke-width="1" />
  <text x="400" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#e65100">Extract</text>
  
  <!-- Transform -->
  <rect x="310" y="430" width="180" height="30" rx="5" fill="#ffe0b2" stroke="#ef6c00" stroke-width="1" />
  <text x="400" y="450" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#e65100">Transform</text>
  
  <!-- Load -->
  <rect x="310" y="470" width="180" height="30" rx="5" fill="#ffe0b2" stroke="#ef6c00" stroke-width="1" />
  <text x="400" y="490" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#e65100">Load</text>
  
  <!-- Cache Manager & Parquet -->
  <rect x="310" y="510" width="180" height="30" rx="5" fill="#ffe0b2" stroke="#ef6c00" stroke-width="1" />
  <text x="400" y="530" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#e65100">Cache Manager & Parquet Writer</text>
  
  <!-- API and UI -->
  <rect x="530" y="320" width="220" height="220" rx="10" fill="#e8eaf6" stroke="#3949ab" stroke-width="2" />
  <text x="640" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#3949ab">API and UI</text>
  
  <!-- REST API Controllers -->
  <rect x="550" y="390" width="180" height="30" rx="5" fill="#c5cae9" stroke="#3f51b5" stroke-width="1" />
  <text x="640" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#283593">REST API Controllers</text>
  
  <!-- SignalR Hubs -->
  <rect x="550" y="430" width="180" height="30" rx="5" fill="#c5cae9" stroke="#3f51b5" stroke-width="1" />
  <text x="640" y="450" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#283593">SignalR Hubs</text>
  
  <!-- Workbench & Query Builder -->
  <rect x="550" y="470" width="180" height="30" rx="5" fill="#c5cae9" stroke="#3f51b5" stroke-width="1" />
  <text x="640" y="490" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#283593">Workbench & Query Builder</text>
  
  <!-- Chat & ETW Explorer -->
  <rect x="550" y="510" width="180" height="30" rx="5" fill="#c5cae9" stroke="#3f51b5" stroke-width="1" />
  <text x="640" y="530" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#283593">Chat & ETW Explorer</text>
  
  <!-- Plugin System -->
  <rect x="770" y="320" width="220" height="220" rx="10" fill="#f3e5f5" stroke="#6a1b9a" stroke-width="2" />
  <text x="880" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#6a1b9a">Plugin System</text>
  
  <!-- Plugin Manager -->
  <rect x="790" y="390" width="180" height="30" rx="5" fill="#e1bee7" stroke="#8e24aa" stroke-width="1" />
  <text x="880" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#4a148c">Plugin Manager</text>
  
  <!-- Plugin Domain -->
  <rect x="790" y="430" width="180" height="30" rx="5" fill="#e1bee7" stroke="#8e24aa" stroke-width="1" />
  <text x="880" y="450" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#4a148c">Plugin Domain</text>
  
  <!-- Plugin Interfaces -->
  <rect x="790" y="470" width="180" height="30" rx="5" fill="#e1bee7" stroke="#8e24aa" stroke-width="1" />
  <text x="880" y="490" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#4a148c">Plugin Interfaces</text>

  <!-- Additional Interfaces -->
  <rect x="790" y="510" width="180" height="30" rx="5" fill="#e1bee7" stroke="#8e24aa" stroke-width="1" />
  <text x="880" y="530" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#4a148c">Extension Points</text>
  
  <!-- Connection Lines - IMPROVED: Horizontal dotted line connecting Core to all components -->
  <!-- One horizontal line across the entire width -->
  <path d="M 160 300 L 880 300" stroke="#ccc" stroke-width="1" fill="none" stroke-dasharray="5,5" />
  
  <!-- Vertical connectors from horizontal line to each component -->
  <path d="M 160 300 L 160 320" stroke="#ccc" stroke-width="1" fill="none" stroke-dasharray="5,5" />
  <path d="M 400 300 L 400 320" stroke="#ccc" stroke-width="1" fill="none" stroke-dasharray="5,5" />
  <path d="M 640 300 L 640 320" stroke="#ccc" stroke-width="1" fill="none" stroke-dasharray="5,5" />
  <path d="M 880 300 L 880 320" stroke="#ccc" stroke-width="1" fill="none" stroke-dasharray="5,5" />
  
  <!-- Vertical connector from Core to horizontal line -->
  <path d="M 500 270 L 500 300" stroke="#ccc" stroke-width="1" fill="none" stroke-dasharray="5,5" />
  
  <!-- ETW System to Collectors - FIXED alignment with very subtle connection -->
  <path d="M 160 580 L 160 540" stroke="#ccc" stroke-width="1" fill="none" stroke-dasharray="5,5" />

  <!-- Legend -->
  <rect x="820" y="580" width="130" height="40" rx="5" fill="#ffffff" stroke="#ccc" stroke-width="1" />
  <text x="885" y="605" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333">Component Interaction</text>
  <line x1="850" y1="605" x2="840" y2="605" stroke="#ccc" stroke-width="1" stroke-dasharray="5,5" />
</svg>
