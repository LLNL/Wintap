<!-- Header -->
<header>
    <h1>Wintap Local Language Model</h1>
    <h5>Model: phi-3-mini</h5>
</header>

<!-- Chat Container -->
<div class="chat-container">
    <!-- Results Window -->
    <div class="results-window">
        <div class="message" *ngFor="let message of messages">
            <div [ngClass]="{'user-message': message.isUser, 'ai-message': !message.isUser}">
                <img *ngIf="!message.isUser" src="assets/wintap.svg" alt="AI Icon" class="ai-icon">
                <p>{{ message.text }}</p>
                <span class="timestamp">{{ message.timestamp | date:'shortTime' }}</span>
            </div>
        </div>
        <p-progressSpinner #spinner [hidden]="isSpinnerHidden" ariaLabel="loading"></p-progressSpinner>
    </div>

    <!-- Prompt Window -->
    <div class="prompt-window">
        <textarea #prompt id="float-input" rows="1" pInputTextarea (keydown.enter)="sendPrompt(); $event.preventDefault()" [disabled]="isPromptDisabled" (input)="adjustTextareaHeight($event)" style="width: 100%;"></textarea>
        <button type="button" class="send-button" (click)="sendPrompt()">
            <i class="pi pi-send"></i>
        </button>
        <button type="button" class="refresh-button" (click)="performSetup()">
            <i class="pi pi-refresh"></i>
        </button>
    </div>
</div>

<!-- Error Message -->
<div class="error-message" *ngIf="errorMessage !== ''">
    {{ errorMessage }}
</div>
